<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      padding: 14px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 14px;
      color: #58a6ff;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
    }

    .logo-icon { font-size: 20px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8b949e;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.connected { background: #3fb950; box-shadow: 0 0 6px #3fb95066; }
    .dot.error { background: #f85149; }

    .hint {
      font-size: 11px;
      color: #8b949e;
      line-height: 1.5;
      border-top: 1px solid #30363d;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-icon">⬡</span>
    NetScope
  </div>
  <div class="status-row">
    <span class="dot" id="dot"></span>
    <span id="status-text">Checking…</span>
  </div>
  <p class="hint" id="hint">Make sure the NetScope desktop app is running.</p>
  <script src="popup.js"></script>
</body>
</html>
